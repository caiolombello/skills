name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Python ${{ matrix.python }} checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install metadata check dependency
        run: python -m pip install -r setup/requirements-checks.txt
      - name: Source metadata, references and public profiles
        run: python -B setup/doctor.py
      - name: Generated catalog and frontend payload
        run: |
          python -B setup/build_catalog.py
          python -B setup/build_frontend.py
      - name: Offline behavioral tests and provider manifest checks
        run: |
          python -B -m unittest discover -s setup/tests -v
          python -B -m unittest discover -s codex-claude-resume/tests -v
